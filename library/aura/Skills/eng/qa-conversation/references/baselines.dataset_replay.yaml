    arms: {DEV-CHAT: 0.813, OLD-CHAT: 0.688, DEV-54: 0.938}

  warmth:
    braintrust_id: "23c959c7-235a-4d08-b588-fbd5443db3f0"
    name: aurie-voice-warmth-qa
    rows: 16
    judgements: 48
    covers: [V1a, R1, R4, R5, R7, A4, A7, A11]
