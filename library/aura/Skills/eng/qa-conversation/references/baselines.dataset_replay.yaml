  repetition:
    braintrust_id: "124b3e6b-aa40-4962-b90f-6c041aa445d5"
    name: aurie-repetition-patterns-qa-v1
    rows: 60
    judgements: 60
    scenarios: 12
    replicates_per_scenario: 5
    covers: [N1, N2, N3, V1a, A12]
    baseline: {pass: 49, total: 60, rate: 0.817}
    arms: {DEV-CHAT: 0.867, OLD-CHAT: 0.817, DEV-54: 0.917}
    reporting: >-
      Report separately and never pooled with the others. These 60 rows are 12
      replicated cohorts, not 60 independent cases; pooling them into a suite
      total treats replicates as evidence and overstates n by a factor of five.

  hard_conversations:
    braintrust_id: "6210ba1a-0b90-4f72-825d-1a4703384c5a"
