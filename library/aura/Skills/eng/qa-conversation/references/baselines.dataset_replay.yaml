# Measured in the same run but NOT part of the locked suite. Recorded because a
# candidate touching these behaviours should be read against them, and because
# leaving them out of the file is how they get re-measured from scratch.
adjacent_datasets:
  workplace:
    name: practical-help-workplace-communications-qa-v2
    judgements: 30
