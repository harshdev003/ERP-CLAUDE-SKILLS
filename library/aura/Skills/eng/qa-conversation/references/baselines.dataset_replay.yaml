    judgements: 18
    baseline: {pass: 7, total: 18, rate: 0.389}

# What counts as a move, so a run does not argue about it afterwards.
interpretation:
  suite_total_forbidden: >-
    There is no single pass rate across the suite. The datasets have different
    sizes and different replication, and one of them is cohort-replicated. Report
    per dataset.
  material_change_pp_owned_by: "release_contract.yaml - resolution.material_change_pp"
  material_change_note: >-
    Below roughly five percentage points on a 48-judgement dataset is one or two
    rows moving, which is inside what a re-draw produces. Treat smaller deltas as
    unmoved rather than as an improvement or a regression.
  uncertain_handling: >-
    An `uncertain` label is not a pass. Resolve it by discussion or a second
    blinded reviewer before it enters a rate; the source run resolved two by hand.
