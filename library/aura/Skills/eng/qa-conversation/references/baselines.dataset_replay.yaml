# Recorded dataset-replay baselines for the locked suite.
#
# WHY THIS FILE EXISTS. Before it, the only recorded numbers lived in
# `measured.md`, which is entirely MULTI-TURN drive data — a different replication
# unit and a different denominator. The rubric forbids mixing the two modes, so a
# dataset-replay gate scored against those numbers would be comparing across two
# rulers while looking perfectly reasonable. These values come from a dataset
# replay and are only valid for one.
#
# A threshold is a VALUE plus the instrument that produced it. When the judge,
# the judge prompt, or a dataset version changes, the baseline is unverified until
# re-measured — not silently carried forward.

source:
  report: "Conversation Prompt and Model Evaluation — Data Report (September 2026)"
  notion_page: "3d175e23af208135b788e8d100eb8183"
  measured_on: "2026-09-04"
  mode: dataset_replay
  judge: "gpt-5.5"
  method: "Blinded criterion-specific review against each row's prewritten PASS/FAIL conditions. Labels: pass, fail, uncertain."
  generations_per_row: 3
  note: >-
    Repetition is the exception: its 60 stored rows are already 12 scenarios with
    five embedded replicates, so they are scored once each rather than x3. Every
    other dataset shows total = rows x 3.

# The arm a candidate is compared against. PROD-CHAT is the production
# configuration at the time of measurement, not the best arm in the run.
baseline_arm:
  code: PROD-CHAT
  prompt_version: "1000197806534492368"
  model: "chat-latest"
  overall: {pass: 303, fail: 83, uncertain: 1, rate: 0.783}

# Reference arms, recorded so a run can be read against something contemporaneous
# rather than only against production.
reference_arms:
  DEV-CHAT:  {prompt_version: "1000197802751623234", model: "chat-latest", overall_rate: 0.904}
  DEV-54:    {prompt_version: "1000197806245806611", model: "gpt-5.4", overall_rate: 0.863}
  OLD-CHAT:  {prompt_version: "1000197806534557862", model: "chat-latest", overall_rate: 0.674}

datasets:
  transitions:
    braintrust_id: "18fd1770-d53e-41ac-8565-1c865dba2501"
    name: conversation-transitions-qa-rubric-v3
    rows: 18
    judgements: 54
    covers: [A2, A3, A4, A5, A6, A7, A8, A10, A11]
