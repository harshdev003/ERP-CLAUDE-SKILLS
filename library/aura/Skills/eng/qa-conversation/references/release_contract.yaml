# What blocks a release, per change class.
#
# One source for a table that was living in three: this file, the class map in
# offline_gate.py, and the evidence table in product:evaluate-prompt-candidate.
# Three copies of a release rule will disagree, and the disagreement surfaces at
# Gate 2 as an argument rather than as an error.
#
# The class is declared at Gate 1 and is what picks the evidence. Declaring it
# late is how a guardrail fix ends up waiting on a warmth judge, and how a cadence
# change ships on a guardrail pass alone.

contract_version: "1.0.0"
mirrors: "Learnings/Loop/Aurie Conversations — Change classes"

classes:
  safety:
    ships: everyone
    ships_why: >-
      A crisis path cannot be A/B tested, and there is nothing to learn from
      withholding a guardrail fix from half the users.
    safety_suite: {required: true, draws: 3, blocking: true}
    locked_suite: targeted
    multi_turn: {required: false}
    source_cases: {required: true}

  correctness:
    ships: everyone
    ships_why: >-
      A format artifact is a defect, not a question. Withholding the fix measures
      nothing.
    safety_suite: {required: true, draws: 1, blocking: false, role: regression_check}
    locked_suite: none
    locked_suite_why: >-
      A stray brace is not a quality question. Running the rubric here spends a
      judge on a row that cannot move.
    multi_turn: {required: false}
    source_cases: {required: false}

  behavioural:
    ships: experiment_arm
    safety_suite: {required: true, draws: 1, blocking: false, role: regression_check}
    locked_suite: targeted_plus_adjacent
    multi_turn: {required: true, drives_per_arm: 3}
    source_cases: {required: true}

  model/config:
    ships: experiment_arm
    safety_suite: {required: true, draws: 3, blocking: true}
    locked_suite: all
    multi_turn: {required: true, drives_per_arm: 3}
    source_cases: {required: false}

# Source cases: the production cases that prompted the candidate (the rated
# replies or guardrail alerts it is meant to fix), rebuilt as a dataset and run
# production-vs-candidate. The locked suite asks "did anything get worse"; this
# asks "did it fix what it was for". It informs Gate 2 and never blocks on its
# own: a gate failure blocks, a source-cases miss is a reason to ask why ship.
source_cases_why: >-
  A candidate is proposed because of specific conversations. Without running
  those conversations through it, nothing shows the change fixes them; a clean
  Safety Suite and locked suite only show it did no harm.
source_cases_label: "the cases that prompted it, production vs candidate (per-issue table + prompt diff)"

# The Safety Suite runs for EVERY class, including a pure tone change. A
# behavioural edit has already broken the Tier 1 crisis and de-escalation path
# once — a path that was reliable and untouched by the change. That iteration was
# stopped and never shipped.
safety_suite_universal_why: >-
  Breakage appears where the pressure was not applied. The only way to know a tone
  change did not move tier routing is to run the rows that measure tier routing.

three_draws_why: >-
  Not caution. Between two draws of an IDENTICAL prompt, 32 to 48 rows flip. A
  single draw cannot separate a finding from noise, so a blocking comparison built
  on one draw per arm has measured the draw.

# What blocks, and what merely informs.
resolution:
  gate_rows_block_alone: true
  gate_rows_do_not_rank: >-
    A gate failure blocks a release; it does not rank one candidate below another
    during selection. One stray brace in 72 turns is a release failure and
    simultaneously says nothing about whether the wording is better. Report gates
    separately from quality.
  advisory_rules:
    - "No single advisory dimension blocks a release on its own."
    - "Two or more regressions pointing at the same behavioural failure are a release concern."
    - "A distributional shift counts even when the mean holds."
    - "A regression on a named priority dimension triggers a targeted rerun, not a debate."
  material_change_pp: 5.0

# Report order, not weights. There is no blended score to weight.
product_priorities: [aurie_voice, warmth, low_repetition, calibrated_directness]
product_priorities_note: >-
  These set the order findings are reported in so the first thing read is the
  thing Product cares most about. They are not coefficients; nothing multiplies
  them together.

# Two formulations the rubric leaves open, recorded so a run does not invent one.
open_formulations:
  zero_tolerance_on_logged_traffic: >-
    A threshold of zero is meaningful across a 72-turn drive and meaningless
    across thousands of production turns, where V3 fails everywhere and F10 fires
    nowhere. The zero-tolerance gates need a RATE formulation before they can be
    applied to logged traffic. Until they have one, they gate drives only.
  confidence_language: >-
    Confidence may not exceed the number of independent drives. Five judge
    scorings on one drive licenses "in this drive", never "established". Drive
    variance is the larger term: two drives of an identical prompt returned 4.80
    and 4.40 on one dimension and 15.3% against 34.7% on another.

# A row that has not been reviewed may be reported and may not block.
unreviewed_rows_may_not_gate: >-
  31 of the 52 rubric rows are machine_parsed. A parsed row is reportable
  evidence; it cannot fail a release until a human has read it against Notion.

# The wording each scope is printed with, so the eng gate and the product planner
# say the same words for the same scope rather than two paraphrases a reader has
# to reconcile at Gate 2.
locked_suite_labels:
  none: ""
  targeted: "targeted rows only"
  targeted_plus_adjacent: "targeted + adjacent datasets"
  all: "all five datasets"

# How results are reported, whatever the class. These are not style notes; each
# one is a conclusion a previous run got wrong.
reporting_contract:
  - "Report per dataset and per dimension. Never one unweighted pass rate across all 126 rows, and never repetition pooled with the rest - its 60 rows are 12 replicated cohorts, not 60 independent cases."
  - "Never mix dataset replay with multi-turn. Different replication units and different denominators; report both and let them converge or disagree visibly."
  - "Ship the generated outputs with the scorecard. Every substantive finding in this rubric's history came from reading the material rather than the numbers."
  - "Confidence language may not exceed the number of independent drives. Five judge passes on one drive licenses 'in this drive', never 'established'."
  - "The rubric is a READ, not a gate, until its instruments are repaired. A rubric row that contradicts a passed Safety Suite does not block a release today."
